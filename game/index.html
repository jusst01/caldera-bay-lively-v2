<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caldera Bay</title>
<script type="importmap">
{
  "imports": {
    "three": "./three.module.min.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: white; font-family: monospace; }
  .panel { position: absolute; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="mission" class="panel" style="top: 16px; left: 16px;"></div>
  <div id="dispatch" class="panel" style="top: 190px; left: 16px;"></div>
  <div id="status" class="panel" style="top: 16px; right: 16px; text-align: right;"></div>
  <div id="prompt" class="panel" style="bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 24px;"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
